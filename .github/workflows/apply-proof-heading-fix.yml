name: Apply services menu link fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-proof-heading-fix.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let Services link navigate to overview
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, files);
              else if (entry.isFile() && entry.name.endsWith('.html')) files.push(full);
            }
            return files;
          }

          let changed = false;
          const changedFiles = [];
          for (const file of walk('.')) {
            let html = fs.readFileSync(file, 'utf8');
            const before = html;
            html = html
              .replace(/document\.querySelectorAll\('\.tag-desktop-nav \.dropdown-btn'\)/g, "document.querySelectorAll('.tag-desktop-nav button.dropdown-btn')")
              .replace(/document\.querySelectorAll\("\.tag-desktop-nav \.dropdown-btn"\)/g, 'document.querySelectorAll(".tag-desktop-nav button.dropdown-btn")');

            if (html !== before) {
              fs.writeFileSync(file, html);
              changed = true;
              changedFiles.push(file);
            }
          }

          if (!changed) {
            console.log('No Services link click fix needed.');
          } else {
            console.log(`Updated ${changedFiles.length} files:`);
            for (const file of changedFiles) console.log(file);
          }
          NODE
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tagaps"
          git config user.email "systems@tagaps.com"
          git add .
          git commit -m "Fix services overview menu link"
          git push
