name: Apply proof heading fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-proof-heading-fix.yml'

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage proof heading
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = ['index.html', 'home.html'];
          const headingPattern = /<h2[^>]*>Our work spans 25 years,[\s\S]*?mission-driven organizations\.<\/h2>/;
          const headingFixed = '<h2 class="proof-heading-title">Our work spans 25 years,<br>more than 15 industries, and<br>for-profit companies and mission-driven organizations.</h2>';
          const css = `<style id="tag-proof-heading-three-line-fix-static">
.proof-elements{padding:clamp(4.25rem,7vw,7rem) 0!important}
.proof-heading{width:100%!important;max-width:1500px!important;margin:0 auto clamp(2rem,4vw,3.25rem)!important;text-align:center!important}
.proof-heading h2{max-width:1500px!important;margin-left:auto!important;margin-right:auto!important;font-size:clamp(2.4rem,4.1vw,4.15rem)!important;line-height:1.16!important;letter-spacing:0!important;text-wrap:balance!important;color:#c4d6d1!important}
.proof-heading h2 br{display:block!important}
.proof-heading p{max-width:42rem!important;margin-left:auto!important;margin-right:auto!important;font-size:clamp(1.05rem,1.45vw,1.3rem)!important;line-height:1.45!important}
@media (max-width:1180px){.proof-heading{max-width:1080px!important}.proof-heading h2{max-width:1080px!important;font-size:clamp(2rem,4.15vw,3.25rem)!important;line-height:1.14!important}}
@media (max-width:1024px){.proof-heading{max-width:940px!important}.proof-heading h2{max-width:940px!important;font-size:clamp(1.9rem,4vw,2.85rem)!important;line-height:1.14!important}}
@media (max-width:900px){.proof-heading{max-width:820px!important}.proof-heading h2{max-width:820px!important;font-size:clamp(1.75rem,3.9vw,2.45rem)!important;line-height:1.14!important}}
@media (max-width:760px){.proof-elements{padding:3.5rem 0!important}.proof-heading{max-width:680px!important;text-align:center!important}.proof-heading h2{max-width:680px!important;font-size:clamp(1.55rem,3.85vw,2.1rem)!important;line-height:1.16!important;text-align:center!important}.proof-heading h2 br{display:block!important}.proof-heading p{font-size:1rem!important}}
@media (max-width:640px){.proof-heading{text-align:left!important}.proof-heading h2{max-width:100%!important;margin-left:0!important;margin-right:0!important;text-align:left!important;font-size:clamp(1.42rem,7.2vw,2.25rem)!important;line-height:1.1!important;text-wrap:balance!important}.proof-heading h2 br{display:block!important}.proof-heading p{margin-left:0!important;margin-right:0!important;text-align:left!important}}
@media (max-width:420px){.proof-heading h2{font-size:clamp(1.25rem,6.6vw,1.85rem)!important;max-width:100%!important}}
</style>`;
          const runtime = `<script id="tag-proof-heading-runtime-fix">
(function(){
  function fixProofHeading(){
    var h = document.querySelector('.proof-heading h2');
    if(!h) return;
    h.classList.add('proof-heading-title');
    h.innerHTML = 'Our work spans 25 years,<br>more than 15 industries, and<br>for-profit companies and mission-driven organizations.';
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fixProofHeading);
  else fixProofHeading();
})();
</script>`;

          let changed = false;
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            const before = html;
            html = html.replace(headingPattern, headingFixed);
            html = html.replace(/<style id="tag-proof-heading-three-line-fix-static">[\s\S]*?<\/style>/, css);
            if (!html.includes('tag-proof-heading-three-line-fix-static')) {
              html = html.replace('</head>', `${css}</head>`);
            }
            html = html.replace(/<script id="tag-proof-heading-runtime-fix">[\s\S]*?<\/script>/, '');
            html = html.replace('</body>', `${runtime}</body>`);
            if (html !== before) {
              fs.writeFileSync(file, html);
              changed = true;
            }
          }

          if (!changed) {
            console.log('No changes needed.');
          }
          NODE
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tagaps"
          git config user.email "systems@tagaps.com"
          git add index.html home.html
          git commit -m "Enforce responsive proof heading layout"
          git push
