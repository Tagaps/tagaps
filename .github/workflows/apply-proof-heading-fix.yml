name: Apply force services navigation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-proof-heading-fix.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force Services menu item to navigate to overview
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, files);
              else if (entry.isFile() && entry.name.endsWith('.html')) files.push(full);
            }
            return files;
          }

          const forceScript = [
            '<script id="tag-force-services-overview-link">',
            '(function(){',
            '  function goToServices(e){',
            '    var trigger = e.target && e.target.closest && e.target.closest(".tag-desktop-nav .dropdown > .dropdown-btn, #services-dropdown-btn");',
            '    if(!trigger) return;',
            '    var text = (trigger.textContent || "").replace(/\\s+/g, " ").trim().toLowerCase();',
            '    if(text.indexOf("services") !== 0) return;',
            '    e.preventDefault();',
            '    e.stopPropagation();',
            '    if(e.stopImmediatePropagation) e.stopImmediatePropagation();',
            '    window.location.assign("/services");',
            '  }',
            '  document.addEventListener("click", goToServices, true);',
            '})();',
            '<' + '/script>'
          ].join('\n');

          let changed = false;
          const changedFiles = [];
          for (const file of walk('.')) {
            let html = fs.readFileSync(file, 'utf8');
            const before = html;
            html = html.replace(/<script id="tag-force-services-overview-link">[\s\S]*?<\/script>/g, '');
            if (html.includes('</body>')) {
              html = html.replace('</body>', forceScript + '\n</body>');
            } else {
              html += '\n' + forceScript + '\n';
            }
            if (html !== before) {
              fs.writeFileSync(file, html);
              changed = true;
              changedFiles.push(file);
            }
          }

          if (!changed) {
            console.log('No Services force navigation update needed.');
          } else {
            console.log(`Updated ${changedFiles.length} files:`);
            for (const file of changedFiles) console.log(file);
          }
          NODE
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tagaps"
          git config user.email "systems@tagaps.com"
          git add .
          git commit -m "Force Services menu item to overview"
          git push
