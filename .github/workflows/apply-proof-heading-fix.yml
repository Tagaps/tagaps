name: Apply homepage hero cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-proof-heading-fix.yml'

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove homepage orientation line
        run: |
          node <<'NODE'
          const fs = require('fs');

          const files = ['index.html', 'home.html'];
          const orientationPattern = /<p class="hero-orientation">[\s\S]*?<\/p>/g;

          let changed = false;
          for (const file of files) {
            let html = fs.readFileSync(file, 'utf8');
            const before = html;
            html = html.replace(orientationPattern, '');
            if (html !== before) {
              fs.writeFileSync(file, html);
              changed = true;
            }
          }

          if (!changed) {
            console.log('No hero orientation line found.');
          }
          NODE
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tagaps"
          git config user.email "systems@tagaps.com"
          git add index.html home.html
          git commit -m "Remove homepage hero orientation line"
          git push
