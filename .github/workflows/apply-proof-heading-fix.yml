name: Apply services menu cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-proof-heading-fix.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Services Overview and link Services label
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function walk(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === '.git' || entry.name === 'node_modules') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full, files);
              else if (entry.isFile() && entry.name.endsWith('.html')) files.push(full);
            }
            return files;
          }

          const desktopServicesPattern = /<button class="dropdown-btn" type="button" aria-expanded="false">Services\s*(<svg class="dropdown-icon"[\s\S]*?<\/svg>)<\/button><div class="dropdown-menu"><a href="\/services" id="nav-services">Services Overview<\/a>/g;
          const mobileServicesOverviewPattern = /<li><a href="\/services" id="mobile-nav-services">Services Overview<\/a><\/li>/g;

          let changed = false;
          const changedFiles = [];
          for (const file of walk('.')) {
            let html = fs.readFileSync(file, 'utf8');
            const before = html;
            html = html
              .replace(desktopServicesPattern, '<a href="/services" class="dropdown-btn">Services $1</a><div class="dropdown-menu">')
              .replace(mobileServicesOverviewPattern, '');

            if (html !== before) {
              fs.writeFileSync(file, html);
              changed = true;
              changedFiles.push(file);
            }
          }

          if (!changed) {
            console.log('No services menu cleanup needed.');
          } else {
            console.log(`Updated ${changedFiles.length} files:`);
            for (const file of changedFiles) console.log(file);
          }
          NODE
      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "Tagaps"
          git config user.email "systems@tagaps.com"
          git add .
          git commit -m "Clean up services menu navigation"
          git push
